# ============================================================================================= #
# File: '{{ role_path }}/meta/main.yml'
# --- [ Description ] ------------------------------------------------------------------------- #
#
# Role metadata for gitlab. Description-only: NOT an enforcing argument spec. The role's
# tasks/validate.yml enforces its merged-config guards.
#
# REQUIRED INPUTS -- declared empty in defaults and supplied by the playbook, because every
# artifact location carries an account id and a concrete default would ship one site's values:
#
#   gitlab.installer.bucket    S3 bucket holding the package (the application repository).
#   gitlab.installer.version   Three-part GitLab version the package delivers; read back from
#                              the version manifest GitLab installs.
#   gitlab.installer.sha256    Lowercase 64-character digest of that object, verified on the
#                              controller and again on the GUEST before dnf installs it.
#
# FROM THE INVENTORY: aws_private_ip_address, the node's address in external_url.
#
# The controller fetches the object with its own credentials; the guest is never given any.
# ============================================================================================= #
---
galaxy_info:
  role_name: 'gitlab'
  namespace: 'nwarila_platform'
  author: 'nwarila-platform'
  description: >-
    GitLab for CIS-hardened RHEL 8. Installs the pinned, digest- and signature-verified
    gitlab-fips package with every bundled service on one node, lets Gitaly execute its runtime
    binaries under fapolicyd, and reconfigures only when the version or gitlab.rb changes -- then
    reads the version, the services, readiness and FIPS mode back from GitLab itself.
  license: 'MIT'
  min_ansible_version: '2.21'
  platforms:
    - name: 'EL'
      versions:
        - '8'
  galaxy_tags: ['rhel', 'cis', 'stig', 'gitlab', 'git', 'fips']

dependencies: []
