# ============================================================================================= #
# File: '{{ role_path }}/meta/main.yml'
# --- [ Description ] ------------------------------------------------------------------------- #
#
# Role metadata for gitlab. Description-only: NOT an enforcing argument spec. The role's
# tasks/validate.yml enforces its merged-config guards.
#
# REQUIRED INPUTS -- declared empty in defaults and supplied by the playbook, because each is
# particular to a site, a deployment or a node, and a concrete default would ship one site's
# values. Every node:
#
#   gitlab.installer.bucket    S3 bucket holding the package (the application repository).
#   gitlab.installer.version   Three-part GitLab version the package delivers; read back from
#                              the version manifest GitLab installs.
#   gitlab.installer.sha256    Lowercase 64-character digest of that object, verified on the
#                              controller and again on the GUEST before dnf installs it.
#   gitlab.node_role           all-in-one (the default), rails, gitaly, praefect or redis.
#
# all-in-one and rails:
#
#   gitlab.external_url        The http:// or https:// URL GitLab serves itself at, without
#                              quotes, backslashes or whitespace: gitlab.rb holds it in a
#                              Ruby string.
#
# rails and praefect:
#
#   gitlab.auto_migrate        True on exactly one node per database, which migrates it.
#   gitlab.secrets_json        The first configured node's gitlab-secrets.json.
#   gitlab.database.{host,port,name,username,password}
#                              The external PostgreSQL and the service's own role in it.
#   gitlab.database_bootstrap.{enabled,master_database,master_username,master_password}
#                              On the one node that creates its service's role and database,
#                              as the database's master user, before its first reconfigure.
#
# rails:
#
#   gitlab.monitoring_whitelist  CIDRs allowed to read the health endpoints.
#   gitlab.redis.{password,sentinels,sentinel_password}
#                              Every Redis node's private IPv4, each serving a Sentinel on
#                              sentinel_port, and the Redis and Sentinel passwords.
#   gitlab.gitaly.{address,token}
#                              tcp://<host>:<port> of the virtual storage 'default', and the
#                              token it takes: Praefect's, through the load balancer.
#   gitlab.object_store.{bucket,prefix,region}
#                              Objects go to '<bucket>/<prefix>/<type>'.
#   gitlab.sshd.host_key_source_dir
#                              Root-only directory holding the shared gitlab-sshd host keys.
#
# praefect:
#
#   gitlab.praefect.token      The token Gitaly clients present to Praefect.
#   gitlab.praefect.nodes      Each Gitaly node as {storage, address: tcp://<IPv4>:<port>}.
#   gitlab.gitaly.token        The token Praefect presents to every Gitaly node; never the
#                              same as praefect.token.
#
# gitaly: gitlab.secrets_json, gitlab.gitaly.token (the token Praefect presents),
# gitlab.gitaly.storage (this node's storage name) and gitlab.gitaly.internal_api_url, the
# http:// URL of GitLab's internal API.
#
# redis:
#
#   gitlab.redis.{password,sentinel_password}
#                              The Redis and Sentinel passwords, the same on every Redis node.
#   gitlab.redis.primary       True on the one node that starts as Redis's primary.
#   gitlab.redis.primary_host  That node's private IPv4, the same on every Redis node.
#   gitlab.secrets_json        On every node but the first, the first configured node's
#                              gitlab-secrets.json.
#
# The controller fetches the package with its own credentials; the guest is never given any for
# it. Passwords and tokens are 48 or more letters and digits; the master password reaches psql
# only on its standard input.
# ============================================================================================= #
---
galaxy_info:
  role_name: 'gitlab'
  namespace: 'nwarila_platform'
  author: 'nwarila-platform'
  description: >-
    GitLab for CIS-hardened RHEL 8, on one node or as one role of a distributed layout (Rails,
    Gitaly, Praefect or Redis). Installs the pinned, digest- and signature-verified gitlab-fips
    package, shares one set of secrets across nodes, connects Rails and Praefect each to an
    external PostgreSQL as its own unprivileged role over verified TLS, serves git over SSH with
    gitlab-sshd on shared host keys, lets Gitaly execute its runtime binaries under fapolicyd,
    and reconfigures only when the version or its inputs change -- then reads the version, the
    services, readiness and FIPS mode back from GitLab itself.
  license: 'MIT'
  min_ansible_version: '2.21'
  platforms:
    - name: 'EL'
      versions:
        - '8'
  galaxy_tags: ['rhel', 'cis', 'stig', 'gitlab', 'git', 'fips']

dependencies: []
