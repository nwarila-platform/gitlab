# ============================================================================================= #
# File: '{{ role_path }}/tasks/present_redhat.yml'
# --- [ Description ] ------------------------------------------------------------------------- #
#
# Installs GitLab at the pinned version on a CIS-hardened RHEL 8 host and reconfigures it as the
# node role it is given: every bundled service on one node (all-in-one), or one role of the
# distributed layout (rails, gitaly, redis).
#
# BEGIN reads the host. PROCESS trusts the vendor key, installs the verified package, writes the
# shared secrets, the database's certificate bundle and gitlab.rb, lets Gitaly execute under
# fapolicyd, reconfigures and installs the shared gitlab-sshd host keys, each writing only on
# difference. END reads the version, readiness, the services and FIPS mode back from GitLab
# itself, the gitlab rule back from fapolicyd and the host keys back from gitlab-sshd. It is
# ungated, so a converged host proves what a fresh one does.
#
# ============================================================================================= #
---

#region ------ [ Begin: Read The Host ] ------------------------------------------------------- #

- name: 'BEGIN | Read The Host'
  vars:
    __key_id__: "{{ gitlab_running.signing_key.fingerprint[-8:] | lower }}"
  block:

    # rc-contract: systemctl(1) is-active exits 0 only for an active unit, printing its state.
    - name: 'BEGIN | Read Whether fapolicyd Is Running'
      changed_when: false
      check_mode: false
      failed_when: false
      register: '__gitlab_fapolicyd__'

      ansible.builtin.command:
        argv: [ 'systemctl', 'is-active', 'fapolicyd' ]
        expand_argument_vars: false
        stdin_add_newline: true
        strip_empty_ends: true

    # RPM records an imported key as gpg-pubkey-<last 8 hex of the fingerprint>; asking for that
    # name is how a converged host skips the import.
    # rc-contract: rpm(8) -q exits 0 when the named package is installed and 1 when it is not.
    - name: 'BEGIN | Read Whether The Package Signing Key Is Trusted'
      changed_when: false
      check_mode: false
      failed_when: __gitlab_key__.rc not in [0, 1]
      register: '__gitlab_key__'

      ansible.builtin.command:
        argv: [ 'rpm', '-q', "gpg-pubkey-{{ __key_id__ }}" ]
        expand_argument_vars: false
        stdin_add_newline: true
        strip_empty_ends: true

    - name: 'BEGIN | Read Whether A Reconfigure Was Recorded'
      register: '__gitlab_record_file__'

      ansible.builtin.stat:
        checksum_algorithm: 'sha1'
        follow: false
        get_attributes: false
        get_checksum: false
        get_mime: false
        get_selinux_context: false
        path: '/var/opt/gitlab/.nwarila-reconfigured'

    - name: 'BEGIN | Read What The Last Reconfigure Recorded'
      register: '__gitlab_recorded__'
      when: __gitlab_record_file__.stat.exists

      ansible.builtin.slurp:
        armor: true
        src: '/var/opt/gitlab/.nwarila-reconfigured'

#endregion --- [ Begin: Read The Host ] ------------------------------------------------------- #

#region ------ [ Process: Stage The Package On The Controller ] ------------------------------- #

# With a cache directory, the package is fetched once per play, not once per host: run_once, and
# gated on every play host's own package facts rather than on the one run_once picks, so a play
# whose first host is installed still fetches for the others. A cache already at the pin is kept.
- name: 'PROCESS | Stage The Pinned Package In The Controller Cache'
  become: false
  delegate_to: 'localhost'
  run_once: true
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    __cached__: >-
      {{ gitlab_running.installer.cache_dir }}/{{ gitlab_running.installer.key
         | replace('<version>', gitlab_running.installer.version) | basename }}
    __play_installs__: >-
      {{ ansible_play_hosts | map('extract', hostvars, ['ansible_facts', 'packages'])
         | map(attribute=gitlab_running.package, default=[]) | map('map', attribute='version')
         | map('list') | reject('equalto', [gitlab_running.installer.version])
         | list | length > 0 }}
  when:
    - gitlab_running.installer.cache_dir | length > 0
    - __play_installs__ | bool
  block:

    - name: 'PROCESS | Read The Cached Package Digest'
      register: '__gitlab_cached__'

      ansible.builtin.stat:
        checksum_algorithm: 'sha256'
        follow: false
        get_attributes: false
        get_checksum: true
        get_mime: false
        get_selinux_context: false
        path: "{{ __cached__ }}"

    # The module probes the BUCKET before the object, on a bucket-level grant this deployment
    # does not hold; skipping that probe is the documented answer. A missing object still fails
    # loudly: the key check uses head_object, which the object grant authorizes.
    - name: 'PROCESS | Fetch The Package Into The Controller Cache'
      changed_when: false
      register: '__gitlab_cache_fetch__'
      when: __gitlab_cached__.stat.checksum | default('') != gitlab_running.installer.sha256

      amazon.aws.s3_object:
        bucket: "{{ gitlab_running.installer.bucket }}"
        ceph: false
        debug_botocore_endpoint_logs: false
        dest: "{{ __cached__ }}"
        dualstack: false
        encrypt: true
        encryption_mode: 'AES256'
        expiry: 600
        ignore_nonexistent_bucket: true
        mode: 'get'
        object: >-
          {{ gitlab_running.installer.key
             | replace('<version>', gitlab_running.installer.version) }}
        overwrite: 'always'
        permission: [ 'private' ]
        prefix: ''
        purge_tags: true
        retries: 0
        sig_v4: true
        validate_bucket_name: true
        validate_certs: true

    - name: 'PROCESS | Read The Cached Package Digest Again'
      register: '__gitlab_cache_copy__'
      when: __gitlab_cache_fetch__ is not skipped

      ansible.builtin.stat:
        checksum_algorithm: 'sha256'
        follow: false
        get_attributes: false
        get_checksum: true
        get_mime: false
        get_selinux_context: false
        path: "{{ __cached__ }}"

    - name: 'PROCESS | Require The Cached Package To Match Its Pin'
      when: __gitlab_cache_fetch__ is not skipped

      ansible.builtin.assert:
        fail_msg: >-
          The fetched package has sha256 {{ __gitlab_cache_copy__.stat.checksum }}, but the
          playbook pins {{ gitlab_running.installer.sha256 }}. The object changed under an
          unchanged pin; refusing to ship it.
        quiet: true
        that: __gitlab_cache_copy__.stat.checksum == gitlab_running.installer.sha256

#endregion --- [ Process: Stage The Package On The Controller ] ------------------------------- #

#region ------ [ Process: Install And Configure GitLab ] -------------------------------------- #

- name: 'PROCESS | Install And Configure GitLab At The Pinned Version'
  vars:
    __object__: >-
      {{ gitlab_running.installer.key | replace('<version>', gitlab_running.installer.version) }}
    __package_file__: "{{ __object__ | basename }}"
    __install_required__: >-
      {{ (ansible_facts.packages[gitlab_running.package] | default([])
          | map(attribute='version') | list) != [gitlab_running.installer.version] }}
    # The controller copy the guest receives: the shared cache, or this host's own staging.
    __package_source__: >-
      {{ gitlab_running.installer.cache_dir
         if gitlab_running.installer.cache_dir | length > 0
         else __gitlab_stage__.path | default('') }}/{{ __package_file__ }}
    __fapolicyd_active__: >-
      {{ (__gitlab_fapolicyd__.stdout | trim) == 'active' }}
    # Gitaly executes the binaries it writes at run time; no other node role runs Gitaly.
    __runs_gitaly__: "{{ gitlab_running.node_role in ['all-in-one', 'gitaly'] }}"
    __rails__: "{{ gitlab_running.node_role == 'rails' }}"
    # What GitLab was reconfigured from: the version and the gitlab.rb written below. A
    # difference from the record on disk reconfigures.
    __record__: "{{ gitlab_running.installer.version }} {{ __gitlab_config__.stat.checksum }}"
    __recorded__: "{{ __gitlab_recorded__.content | default('') | b64decode }}"
    # Seconds gitlab-ctl reconfigure may run. UNMEASURED: a bound inside the converge step's
    # budget until a live run measures reconfigure.
    __reconfigure_bound__: 1800
    # Seconds timeout(1) waits after its SIGTERM at the bound before it sends SIGKILL.
    __reconfigure_grace__: 60
  block:

    #region ------ [ Process: Trust The Package Signing Key ] --------------------------------- #

    - name: 'PROCESS | Stage The Package Signing Key'
      changed_when: false
      when: __gitlab_key__.rc != 0

      ansible.builtin.copy:
        backup: false
        decrypt: true
        dest: "{{ __temp_dir__.path }}/{{ gitlab_running.signing_key.file }}"
        follow: false
        force: true
        group: 'root'
        mode: '0600'
        owner: 'root'
        remote_src: false
        src: "{{ gitlab_running.signing_key.file }}"
        unsafe_writes: false

    # rpm_key refuses the shipped key unless its fingerprint is the pinned one.
    - name: 'PROCESS | Trust The Package Signing Key'
      when: __gitlab_key__.rc != 0

      ansible.builtin.rpm_key:
        fingerprint: [ "{{ gitlab_running.signing_key.fingerprint }}" ]
        key: "{{ __temp_dir__.path }}/{{ gitlab_running.signing_key.file }}"
        state: 'present'
        validate_certs: true

    #endregion --- [ Process: Trust The Package Signing Key ] --------------------------------- #

    #region ------ [ Process: Install The Pinned Package ] ------------------------------------ #

    # The controller fetches the object with its own credentials; the guest is never given any.
    # The digest is checked on the controller before a byte is shipped, and again on the guest
    # copy, because that is the one dnf installs; the signature proves GitLab built it.
    #
    # On a first install, the package's post-install step writes the vendor gitlab.rb with a
    # placeholder URL, which its post-transaction step treats as unset: it skips its upgrade
    # script and runs no reconfigure inside dnf, so the reconfigure below is the only one.
    - name: 'PROCESS | Install The Pinned Package'
      when: __install_required__ | bool
      block:

        # Without a cache directory, each host stages its own controller copy.
        - name: 'PROCESS | Stage The Package For This Host Alone'
          become: false
          delegate_to: 'localhost'
          vars:
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
          when: gitlab_running.installer.cache_dir | length == 0
          block:

            - name: 'PROCESS | Create The Controller Staging Directory'
              changed_when: false
              check_mode: false
              register: '__gitlab_stage__'

              ansible.builtin.tempfile:
                path: '/tmp'
                prefix: 'gitlab-'
                state: 'directory'
                suffix: ''

            # The module probes the BUCKET before the object, on a bucket-level grant this
            # deployment does not hold; skipping that probe is the documented answer. A missing
            # object still fails loudly: the key check uses head_object, which the object grant
            # authorizes.
            - name: 'PROCESS | Fetch The Package To The Controller'
              changed_when: false

              amazon.aws.s3_object:
                bucket: "{{ gitlab_running.installer.bucket }}"
                ceph: false
                debug_botocore_endpoint_logs: false
                dest: "{{ __gitlab_stage__.path }}/{{ __package_file__ }}"
                dualstack: false
                encrypt: true
                encryption_mode: 'AES256'
                expiry: 600
                ignore_nonexistent_bucket: true
                mode: 'get'
                object: "{{ __object__ }}"
                overwrite: 'always'
                permission: [ 'private' ]
                prefix: ''
                purge_tags: true
                retries: 0
                sig_v4: true
                validate_bucket_name: true
                validate_certs: true

            - name: 'PROCESS | Read The Controller Copy Digest'
              register: '__gitlab_controller_copy__'

              ansible.builtin.stat:
                checksum_algorithm: 'sha256'
                follow: false
                get_attributes: false
                get_checksum: true
                get_mime: false
                get_selinux_context: false
                path: "{{ __gitlab_stage__.path }}/{{ __package_file__ }}"

            - name: 'PROCESS | Require The Controller Copy To Match Its Pin'
              ansible.builtin.assert:
                fail_msg: >-
                  The stored package has sha256 {{ __gitlab_controller_copy__.stat.checksum }},
                  but the playbook pins {{ gitlab_running.installer.sha256 }}. The object
                  changed under an unchanged pin; refusing to ship it.
                quiet: true
                that: __gitlab_controller_copy__.stat.checksum == gitlab_running.installer.sha256

        # Into the loader's temporary directory: root-owned, 0700, removed when the role ends.
        - name: 'PROCESS | Copy The Package To The Guest'
          changed_when: false

          ansible.builtin.copy:
            backup: false
            decrypt: true
            dest: "{{ __temp_dir__.path }}/{{ __package_file__ }}"
            follow: false
            force: true
            group: 'root'
            mode: '0600'
            owner: 'root'
            remote_src: false
            src: "{{ __package_source__ }}"
            unsafe_writes: false

        - name: 'PROCESS | Read The Guest Copy Digest'
          register: '__gitlab_guest_copy__'

          ansible.builtin.stat:
            checksum_algorithm: 'sha256'
            follow: false
            get_attributes: false
            get_checksum: true
            get_mime: false
            get_selinux_context: false
            path: "{{ __temp_dir__.path }}/{{ __package_file__ }}"

        - name: 'PROCESS | Require The Guest Copy To Match Its Pin'
          ansible.builtin.assert:
            fail_msg: >-
              The copy staged on the guest has sha256
              {{ __gitlab_guest_copy__.stat.checksum }}, but the playbook pins
              {{ gitlab_running.installer.sha256 }}. Refusing to install it.
            quiet: true
            that: __gitlab_guest_copy__.stat.checksum == gitlab_running.installer.sha256

        - name: 'PROCESS | Read The Package Signature'
          changed_when: false
          check_mode: false
          failed_when: false
          register: '__gitlab_signature__'

          ansible.builtin.command:
            argv: [ 'rpm', '--checksig', "{{ __temp_dir__.path }}/{{ __package_file__ }}" ]
            expand_argument_vars: false
            stdin_add_newline: true
            strip_empty_ends: true

        - name: 'PROCESS | Require The Vendor Signature'
          ansible.builtin.assert:
            fail_msg: >-
              rpm --checksig did not report a good vendor signature on {{ __package_file__ }}:
              {{ __gitlab_signature__.stdout }} {{ __gitlab_signature__.stderr }}
            quiet: true
            that:
              - __gitlab_signature__.rc == 0
              - __gitlab_signature__.stdout is search('signatures OK')

        # No downgrade: GitLab migrates its database forward, and an older package cannot run it.
        - name: 'PROCESS | Install The Pinned Package From The Verified Copy'
          register: '__gitlab_package__'

          ansible.builtin.dnf:
            allow_downgrade: false
            allowerasing: false
            autoremove: false
            bugfix: false
            cacheonly: false
            disable_gpg_check: false
            disable_plugin: []
            disablerepo: []
            download_only: false
            enable_plugin: []
            enablerepo: []
            exclude: []
            install_weak_deps: true
            installroot: '/'
            lock_timeout: 30
            name: [ "{{ __temp_dir__.path }}/{{ __package_file__ }}" ]
            security: false
            skip_broken: false
            sslverify: true
            state: 'present'
            update_cache: false
            update_only: false
            use_backend: 'auto'
            validate_certs: true

    #endregion --- [ Process: Install The Pinned Package ] ------------------------------------ #

    #region ------ [ Process: Write The GitLab Configuration ] -------------------------------- #

    # Before the first reconfigure, which would otherwise generate this node's own secrets.
    # Written only when absent: reconfigure writes back the secrets this node's gitlab.rb sets,
    # so the file never stays byte-equal to the copy, and replacing it would rewrite it on every
    # converge. Root 0600, as reconfigure itself leaves it.
    - name: 'PROCESS | Write The Shared Secrets Before The First Reconfigure'
      no_log: true
      register: '__gitlab_secrets_file__'
      when: gitlab_running.secrets_json | length > 0

      ansible.builtin.copy:
        backup: false
        content: "{{ gitlab_running.secrets_json }}"
        decrypt: true
        dest: '/etc/gitlab/gitlab-secrets.json'
        follow: false
        force: false
        group: 'root'
        mode: '0600'
        owner: 'root'
        remote_src: false
        unsafe_writes: false

    # libpq verifies the database's certificate against this bundle (sslmode verify-full).
    - name: 'PROCESS | Write The Database Certificate Bundle'
      register: '__gitlab_ca__'
      when: __rails__ | bool

      ansible.builtin.copy:
        backup: false
        decrypt: true
        dest: '/etc/gitlab/rds-ca-bundle.pem'
        follow: false
        force: true
        group: 'root'
        mode: '0644'
        owner: 'root'
        remote_src: false
        src: "{{ gitlab_running.database.ca_file }}"
        unsafe_writes: false

    - name: 'PROCESS | Read The Database Certificate Bundle Digest'
      register: '__gitlab_ca_file__'
      when: __rails__ | bool

      ansible.builtin.stat:
        checksum_algorithm: 'sha256'
        follow: false
        get_attributes: false
        get_checksum: true
        get_mime: false
        get_selinux_context: false
        path: '/etc/gitlab/rds-ca-bundle.pem'

    - name: 'PROCESS | Require The Pinned Database Certificate Bundle'
      when: __rails__ | bool

      ansible.builtin.assert:
        fail_msg: >-
          /etc/gitlab/rds-ca-bundle.pem has sha256 {{ __gitlab_ca_file__.stat.checksum }}, but
          the role pins {{ gitlab_running.database.ca_sha256 }}: the bundle in files/ changed
          without its digest.
        quiet: true
        that: __gitlab_ca_file__.stat.checksum == gitlab_running.database.ca_sha256

    # 0600 as the package's own post-install step leaves it: reconfigure, as root, is its only
    # reader. It holds credentials, so no diff of it is ever shown.
    - name: 'PROCESS | Write gitlab.rb'
      diff: false
      register: '__gitlab_rb__'

      ansible.builtin.template:
        backup: false
        dest: '/etc/gitlab/gitlab.rb'
        follow: false
        force: true
        group: 'root'
        lstrip_blocks: false
        mode: '0600'
        newline_sequence: '\n'
        output_encoding: 'utf-8'
        owner: 'root'
        src: 'gitlab.rb.j2'
        trim_blocks: true
        unsafe_writes: false

    - name: 'PROCESS | Read The gitlab.rb Digest'
      register: '__gitlab_config__'

      ansible.builtin.stat:
        checksum_algorithm: 'sha256'
        follow: false
        get_attributes: false
        get_checksum: true
        get_mime: false
        get_selinux_context: false
        path: '/etc/gitlab/gitlab.rb'

    #endregion --- [ Process: Write The GitLab Configuration ] -------------------------------- #

    #region ------ [ Process: Let Gitaly Execute Under fapolicyd ] ---------------------------- #

    # fapolicyd trusts a file by its RPM digest only once it has learned of it, and reconfigure
    # runs the binaries the package installed. Repeated until a reconfigure is recorded, so a run
    # that stopped between dnf and this refresh repeats it.
    - name: 'PROCESS | Refresh The fapolicyd Trust Database After The Install'
      changed_when: true
      when:
        - __fapolicyd_active__ | bool
        - (__gitlab_package__ is changed) or (__recorded__ != __record__)

      ansible.builtin.command:
        argv: [ 'fapolicyd-cli', '--update' ]
        expand_argument_vars: false
        stdin_add_newline: true
        strip_empty_ends: true

    # GitLab's documented rule: Gitaly unpacks its runtime binaries under its own directory and
    # executes them, and no RPM digest can vouch for a file written at run time. dir= matches the
    # whole subtree, which belongs to the git account that Puma and Workhorse, the services
    # behind GitLab's network listener, also run as on a single node: code running as git can
    # write an ELF there and execute it, so fapolicyd no longer limits native execution for that
    # account under that subtree. Numbered before the default rules' deny of untrusted execution,
    # so it applies. Only a node that runs Gitaly gets it.
    - name: 'PROCESS | Allow Gitaly To Execute Its Runtime Binaries'
      when:
        - __fapolicyd_active__ | bool
        - __runs_gitaly__ | bool

      ansible.builtin.copy:
        backup: false
        content: |
          # Managed by the gitlab role; a local edit is overwritten on the next converge.
          {{ gitlab_running.fapolicyd_rule }}
        decrypt: true
        dest: '/etc/fapolicyd/rules.d/89-gitlab.rules'
        follow: false
        force: true
        group: 'fapolicyd'
        mode: '0644'
        owner: 'root'
        remote_src: false
        unsafe_writes: false

    - name: 'PROCESS | Read The Rules fapolicyd Has Compiled'
      changed_when: false
      check_mode: false
      register: '__gitlab_rules__'
      when:
        - __fapolicyd_active__ | bool
        - __runs_gitaly__ | bool

      ansible.builtin.command:
        argv: [ 'fapolicyd-cli', '--list' ]
        expand_argument_vars: false
        stdin_add_newline: true
        strip_empty_ends: true

    # Matched by its text, not its position: the number fapolicyd lists a rule under shifts with
    # every rule before it.
    - name: 'PROCESS | Load The fapolicyd Rules'
      changed_when: true
      when:
        - __fapolicyd_active__ | bool
        - __runs_gitaly__ | bool
        - gitlab_running.fapolicyd_rule not in __gitlab_rules__.stdout

      ansible.builtin.command:
        argv: [ 'fagenrules', '--load' ]
        expand_argument_vars: false
        stdin_add_newline: true
        strip_empty_ends: true

    #endregion --- [ Process: Let Gitaly Execute Under fapolicyd ] ---------------------------- #

    #region ------ [ Process: Create GitLab's Database Role And Database ] -------------------- #

    # Before the first reconfigure, which migrates as GitLab's own role into its own database.
    # The master user creates both, makes itself a member of the role so that it may create the
    # role's database and, through the role's ownership of the database's public schema, the
    # extensions in it. Read first, and only what is absent is created: there is no CREATE ... IF
    # NOT EXISTS for a role or a database, and the role's password verifier is salted at random,
    # so it is never set twice.
    #
    # The master password reaches psql only on its standard input, as the first line, read into
    # PGPASSWORD by the shell that execs psql; the SQL follows on the same input. Never argv, a
    # file or Ansible's environment keyword, which lands on the command line sudo logs. psql runs
    # without a psqlrc (-X) and stops at the first error. no_log would also hide why psql failed,
    # so each call is judged by the assert after it, which shows psql's own messages with any
    # verifier redacted: they never carry the password.
    - name: 'PROCESS | Create GitLab''s Database Role And Database'
      vars:
        __bootstrap__: "{{ gitlab_running.database_bootstrap }}"
        __role__: "{{ gitlab_running.database.username }}"
        __psql__:
          - '/bin/sh'
          - '-c'
          - 'IFS= read -r PGPASSWORD && export PGPASSWORD && exec "$@"'
          - 'psql'
          - '/opt/gitlab/embedded/bin/psql'
          - '-X'
          - '-w'
          - '-q'
          - '-A'
          - '-t'
          - '-v'
          - 'ON_ERROR_STOP=1'
          - '-f'
          - '-'
          - '-d'
        __conninfo__: >-
          host={{ gitlab_running.database.host }} port={{ gitlab_running.database.port }}
          user={{ __bootstrap__.master_username }} sslmode=verify-full
          sslrootcert=/etc/gitlab/rds-ca-bundle.pem
        # Whether the master user may act as the role: a membership with INHERIT and SET.
        __membership__: >-
          EXISTS (SELECT FROM pg_auth_members m
                  JOIN pg_roles granted ON granted.oid = m.roleid
                  JOIN pg_roles holder ON holder.oid = m.member
                  WHERE granted.rolname = '{{ __role__ }}' AND holder.rolname = current_user
                    AND m.inherit_option AND m.set_option)
        __extensions__: >-
          (SELECT coalesce(json_agg(extname ORDER BY extname), '[]') FROM pg_extension)
        # Matches a SCRAM verifier; the asserts redact it from psql's stderr.
        __verifier__: 'SCRAM-SHA-256[$][A-Za-z0-9+/=:$]*'
      when:
        - __rails__ | bool
        - gitlab_running.database_bootstrap.enabled | bool
      block:

        # rc-contract: psql(1) exits 0 on success, 1 on its own fatal error, 2 when the
        # connection fails, and 3 when a statement fails under ON_ERROR_STOP.
        - name: 'PROCESS | Read Whether GitLab''s Role And Database Exist'
          changed_when: false
          check_mode: false
          failed_when: false
          no_log: true
          register: '__gitlab_db_cluster__'

          ansible.builtin.command:
            argv: "{{ __psql__ + [__conninfo__ ~ ' dbname=' ~ __bootstrap__.master_database] }}"
            expand_argument_vars: false
            stdin: |-
              {{ __bootstrap__.master_password }}
              SELECT json_build_object(
                'role', EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ __role__ }}'),
                'membership', {{ __membership__ }},
                'database', EXISTS (SELECT FROM pg_database
                                    WHERE datname = '{{ gitlab_running.database.name }}'));
            stdin_add_newline: true
            strip_empty_ends: true

        - name: 'PROCESS | Require psql To Have Read The Role And The Database'
          ansible.builtin.assert:
            fail_msg: >-
              psql exited {{ __gitlab_db_cluster__.rc }} reading the role and the database:
              {{ __gitlab_db_cluster__.stderr_lines | map('regex_replace', __verifier__,
              '<verifier>') | list }}
            quiet: true
            that: __gitlab_db_cluster__.rc == 0

        # PostgreSQL's SCRAM-SHA-256 verifier (RFC 7677; PostgreSQL's scram-common.c): 4096
        # PBKDF2-HMAC-SHA-256 iterations over a random 16-byte salt, then the HMAC-derived stored
        # and server keys. Computed on the host from the password on stdin, so the password is
        # never sent to the database at all, and a logged statement can only ever show the
        # verifier. validate.yml holds the password to letters and digits, so SASLprep, which
        # PostgreSQL applies first, leaves it unchanged.
        # rc-contract: python3(1) exits 0 after printing, and 1 on an uncaught exception.
        - name: 'PROCESS | Compute The Role''s Password Verifier'
          changed_when: false
          failed_when: false
          no_log: true
          register: '__gitlab_db_verifier__'
          when: not (__gitlab_db_cluster__.stdout | from_json).role

          ansible.builtin.command:
            argv:
              - "{{ ansible_python_interpreter }}"
              - '-c'
              - |
                import base64, hashlib, hmac, os, sys
                password = sys.stdin.readline().rstrip('\n').encode()
                salt = os.urandom(16)
                salted = hashlib.pbkdf2_hmac('sha256', password, salt, 4096)
                client = hmac.new(salted, b'Client Key', 'sha256').digest()
                server = hmac.new(salted, b'Server Key', 'sha256').digest()
                stored = hashlib.sha256(client).digest()
                b64 = lambda raw: base64.b64encode(raw).decode()
                print(f'SCRAM-SHA-256$4096:{b64(salt)}${b64(stored)}:{b64(server)}')
            expand_argument_vars: false
            stdin: "{{ gitlab_running.database.password }}"
            stdin_add_newline: true
            strip_empty_ends: true

        - name: 'PROCESS | Require The Password Verifier'
          when: __gitlab_db_verifier__ is not skipped

          ansible.builtin.assert:
            fail_msg: >-
              Computing the password verifier exited {{ __gitlab_db_verifier__.rc }}:
              {{ __gitlab_db_verifier__.stderr_lines }}
            quiet: true
            that: __gitlab_db_verifier__.stdout is match('SCRAM-SHA-256[$]4096:')

        # CREATE DATABASE ... OWNER needs the master user to be able to act as the owner, so the
        # membership comes first; each statement commits on its own. A failure is named by the
        # assert that follows, which no_log would otherwise hide.
        - name: 'PROCESS | Create What Is Absent Of The Role, Its Membership And Its Database'
          changed_when: true
          ignore_errors: true
          no_log: true
          register: '__gitlab_db_created__'
          vars:
            __state__: "{{ __gitlab_db_cluster__.stdout | from_json }}"
          when: not (__state__.role and __state__.membership and __state__.database)

          ansible.builtin.command:
            argv: "{{ __psql__ + [__conninfo__ ~ ' dbname=' ~ __bootstrap__.master_database] }}"
            expand_argument_vars: false
            stdin: |-
              {{ __bootstrap__.master_password }}
              {% if not __state__.role %}
              CREATE ROLE {{ __role__ }} LOGIN NOSUPERUSER NOCREATEROLE NOCREATEDB
                PASSWORD '{{ __gitlab_db_verifier__.stdout }}';
              {% endif %}
              {% if not __state__.membership %}
              GRANT {{ __role__ }} TO CURRENT_USER WITH INHERIT TRUE, SET TRUE;
              {% endif %}
              {% if not __state__.database %}
              CREATE DATABASE {{ gitlab_running.database.name }} OWNER {{ __role__ }};
              {% endif %}
            stdin_add_newline: true
            strip_empty_ends: true

        - name: 'PROCESS | Require psql To Have Created What Was Absent'
          when: __gitlab_db_created__ is not skipped

          ansible.builtin.assert:
            fail_msg: >-
              psql exited {{ __gitlab_db_created__.rc }} creating the role, its membership or
              its database: {{ __gitlab_db_created__.stderr_lines | map('regex_replace',
              __verifier__, '<verifier>') | list }}
            quiet: true
            that: __gitlab_db_created__.rc == 0

        # rc-contract: psql(1) exits 0 on success, 1 on its own fatal error, 2 when the
        # connection fails, and 3 when a statement fails under ON_ERROR_STOP.
        - name: 'PROCESS | Read GitLab''s Database And Its Extensions'
          changed_when: false
          check_mode: false
          failed_when: false
          no_log: true
          register: '__gitlab_db_database__'

          ansible.builtin.command:
            argv: "{{ __psql__ + [__conninfo__ ~ ' dbname=' ~ gitlab_running.database.name] }}"
            expand_argument_vars: false
            stdin: |-
              {{ __bootstrap__.master_password }}
              SELECT json_build_object(
                'membership', {{ __membership__ }},
                'owner', (SELECT pg_get_userbyid(datdba) FROM pg_database
                          WHERE datname = current_database()),
                'extensions', {{ __extensions__ }});
            stdin_add_newline: true
            strip_empty_ends: true

        - name: 'PROCESS | Require psql To Have Read The Database And Its Extensions'
          ansible.builtin.assert:
            fail_msg: >-
              psql exited {{ __gitlab_db_database__.rc }} reading the database:
              {{ __gitlab_db_database__.stderr_lines | map('regex_replace', __verifier__,
              '<verifier>') | list }}
            quiet: true
            that: __gitlab_db_database__.rc == 0

        # In the database's public schema, which its owner, the role, owns through
        # pg_database_owner; the master user acts through its membership in the role. A failure
        # is named by the assert that follows, which no_log would otherwise hide.
        - name: 'PROCESS | Create The Absent Extensions As The Master User'
          changed_when: true
          ignore_errors: true
          no_log: true
          register: '__gitlab_db_extensions_created__'
          vars:
            __missing__: >-
              {{ __bootstrap__.extensions
                 | difference((__gitlab_db_database__.stdout | from_json).extensions) }}
          when: __missing__ | length > 0

          ansible.builtin.command:
            argv: "{{ __psql__ + [__conninfo__ ~ ' dbname=' ~ gitlab_running.database.name] }}"
            expand_argument_vars: false
            stdin: |-
              {{ __bootstrap__.master_password }}
              {% for extension in __missing__ %}
              CREATE EXTENSION IF NOT EXISTS {{ extension }};
              {% endfor %}
            stdin_add_newline: true
            strip_empty_ends: true

        - name: 'PROCESS | Require psql To Have Created The Extensions'
          when: __gitlab_db_extensions_created__ is not skipped

          ansible.builtin.assert:
            fail_msg: >-
              psql exited {{ __gitlab_db_extensions_created__.rc }} creating the extensions:
              {{ __gitlab_db_extensions_created__.stderr_lines | map('regex_replace',
              __verifier__, '<verifier>') | list }}
            quiet: true
            that: __gitlab_db_extensions_created__.rc == 0

        # rc-contract: psql(1) exits 0 on success, 1 on its own fatal error, 2 when the
        # connection fails, and 3 when a statement fails under ON_ERROR_STOP.
        - name: 'PROCESS | Read The Extensions Again'
          changed_when: false
          check_mode: false
          failed_when: false
          no_log: true
          register: '__gitlab_db_extensions__'
          when: __gitlab_db_extensions_created__ is changed

          ansible.builtin.command:
            argv: "{{ __psql__ + [__conninfo__ ~ ' dbname=' ~ gitlab_running.database.name] }}"
            expand_argument_vars: false
            stdin: |-
              {{ __bootstrap__.master_password }}
              SELECT {{ __extensions__ }};
            stdin_add_newline: true
            strip_empty_ends: true

        - name: 'PROCESS | Require psql To Have Read The Extensions Again'
          when: __gitlab_db_extensions__ is not skipped

          ansible.builtin.assert:
            fail_msg: >-
              psql exited {{ __gitlab_db_extensions__.rc }} reading the extensions again:
              {{ __gitlab_db_extensions__.stderr_lines | map('regex_replace', __verifier__,
              '<verifier>') | list }}
            quiet: true
            that: __gitlab_db_extensions__.rc == 0

        - name: 'PROCESS | Require GitLab''s Role To Own Its Database With Every Extension'
          vars:
            __database__: "{{ __gitlab_db_database__.stdout | from_json }}"
            __extensions_now__: >-
              {{ (__gitlab_db_extensions__.stdout | from_json)
                 if __gitlab_db_extensions_created__ is changed
                 else __database__.extensions }}

          ansible.builtin.assert:
            fail_msg: >-
              {{ gitlab_running.database.name }} is owned by '{{ __database__.owner }}' (declared
              '{{ __role__ }}'); the master user's membership in {{ __role__ }} with INHERIT and
              SET is {{ __database__.membership }}; the extensions
              {{ __bootstrap__.extensions | difference(__extensions_now__) }} are missing.
            quiet: true
            that:
              - __database__.owner == __role__
              - __database__.membership | bool
              - __bootstrap__.extensions | difference(__extensions_now__) | length == 0

    #endregion --- [ Process: Create GitLab's Database Role And Database ] -------------------- #

    #region ------ [ Process: Reconfigure GitLab ] -------------------------------------------- #

    # Bounded by timeout(1) in argv, not with async: async stages its wrapper as a file and turns
    # pipelining off, and fapolicyd denies the staged file. The bound is __reconfigure_bound__.
    # Also run when this converge rewrote gitlab.rb, wrote the shared secrets or changed the
    # certificate bundle: the conventional apply-on-change trigger.
    - name: 'PROCESS | Reconfigure GitLab'
      changed_when: true
      failed_when: false
      register: '__gitlab_reconfigure__'
      when: >-
        (__recorded__ != __record__) or (__gitlab_rb__ is changed)
        or (__gitlab_secrets_file__ is changed) or (__gitlab_ca__ is changed)

      ansible.builtin.command:
        argv:
          - 'timeout'
          - "--kill-after={{ __reconfigure_grace__ }}"
          - "{{ __reconfigure_bound__ }}"
          - 'gitlab-ctl'
          - 'reconfigure'
        expand_argument_vars: false
        stdin_add_newline: true
        strip_empty_ends: true

    # rc-contract: timeout(1) exits 124 when it stopped the command at the bound. When the
    # command outlives __reconfigure_grace__ as well, timeout kills itself with SIGKILL, which
    # Ansible reports as rc -9 -- as it does for a SIGKILL from the kernel.
    - name: 'PROCESS | Require The Reconfigure To Succeed'
      when: __gitlab_reconfigure__ is not skipped

      ansible.builtin.assert:
        fail_msg: >-
          gitlab-ctl reconfigure {{
          ('timed out after ' ~ __reconfigure_bound__ ~ ' s')
          if __gitlab_reconfigure__.rc == 124 else
          ('was killed by SIGKILL after ' ~ __gitlab_reconfigure__.delta ~ ' (the '
           ~ __reconfigure_bound__ ~ ' s bound plus ' ~ __reconfigure_grace__
           ~ ' s grace, or the kernel)')
          if __gitlab_reconfigure__.rc == -9 else
          ('failed with rc ' ~ __gitlab_reconfigure__.rc) }}. Its output ended:
          {{ __gitlab_reconfigure__.stdout_lines[-40:] }}
          {{ __gitlab_reconfigure__.stderr_lines[-20:] }}
        quiet: true
        that: __gitlab_reconfigure__.rc == 0

    # Written only once a reconfigure has succeeded, so a failed one is retried by the next
    # converge rather than recorded as done.
    - name: 'PROCESS | Record What GitLab Was Reconfigured With'
      ansible.builtin.copy:
        backup: false
        content: "{{ __record__ }}"
        decrypt: true
        dest: '/var/opt/gitlab/.nwarila-reconfigured'
        follow: false
        force: true
        group: 'root'
        mode: '0600'
        owner: 'root'
        remote_src: false
        unsafe_writes: false

    #endregion --- [ Process: Reconfigure GitLab ] -------------------------------------------- #

    #region ------ [ Process: Serve The Shared gitlab-sshd Host Keys ] ------------------------ #

    # Every Rails node must present the same host keys, or a client that reached one node through
    # the load balancer would refuse the other. The first reconfigure generates the node's own
    # and creates the git account they belong to, so the shared ones replace them after it,
    # compared by content. No decrypt: with remote_src the action passes every option to the
    # module, which refuses it.
    - name: 'PROCESS | Install The Shared gitlab-sshd Private Host Keys'
      loop: [ 'ecdsa', 'rsa' ]
      loop_control: { label: "{{ item }}" }
      no_log: true
      register: '__gitlab_sshd_private__'
      when: __rails__ | bool

      ansible.builtin.copy:
        backup: false
        dest: "/var/opt/gitlab/gitlab-sshd/ssh_host_{{ item }}_key"
        follow: false
        force: true
        group: 'git'
        mode: '0600'
        owner: 'git'
        remote_src: true
        src: "{{ gitlab_running.sshd.host_key_source_dir }}/ssh_host_{{ item }}_key"
        unsafe_writes: false

    # No decrypt: with remote_src the action passes every option to the module, which refuses it.
    - name: 'PROCESS | Install The Shared gitlab-sshd Public Host Keys'
      loop: [ 'ecdsa', 'rsa' ]
      loop_control: { label: "{{ item }}" }
      register: '__gitlab_sshd_public__'
      when: __rails__ | bool

      ansible.builtin.copy:
        backup: false
        dest: "/var/opt/gitlab/gitlab-sshd/ssh_host_{{ item }}_key.pub"
        follow: false
        force: true
        group: 'git'
        mode: '0644'
        owner: 'git'
        remote_src: true
        src: "{{ gitlab_running.sshd.host_key_source_dir }}/ssh_host_{{ item }}_key.pub"
        unsafe_writes: false

    # gitlab-sshd reads its host keys only when it starts.
    - name: 'PROCESS | Restart gitlab-sshd On The Shared Host Keys'
      changed_when: true
      when:
        - __rails__ | bool
        - (__gitlab_sshd_private__ is changed) or (__gitlab_sshd_public__ is changed)

      ansible.builtin.command:
        argv: [ 'gitlab-ctl', 'restart', 'gitlab-sshd' ]
        expand_argument_vars: false
        stdin_add_newline: true
        strip_empty_ends: true

    #endregion --- [ Process: Serve The Shared gitlab-sshd Host Keys ] ------------------------ #

  always:

    - name: 'PROCESS | Remove The Controller Staging Directory'
      become: false
      changed_when: false
      delegate_to: 'localhost'
      when: __gitlab_stage__.path is defined
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

      ansible.builtin.file:
        access_time_format: '%Y%m%d%H%M.%S'
        follow: true
        force: false
        modification_time_format: '%Y%m%d%H%M.%S'
        path: "{{ __gitlab_stage__.path }}"
        recurse: false
        state: 'absent'
        unsafe_writes: false

#endregion --- [ Process: Install And Configure GitLab ] -------------------------------------- #

#region ------ [ End: Prove GitLab Runs As Declared ] ----------------------------------------- #

- name: 'END | Prove GitLab Runs As Declared'
  vars:
    __record__: "{{ gitlab_running.installer.version }} {{ __gitlab_config__.stat.checksum }}"
    __release__: "{{ gitlab_running.package }} {{ gitlab_running.installer.version }}"
    __fapolicyd_active__: >-
      {{ (__gitlab_fapolicyd__.stdout | trim) == 'active' }}
    __runs_gitaly__: "{{ gitlab_running.node_role in ['all-in-one', 'gitaly'] }}"
    __rails__: "{{ gitlab_running.node_role == 'rails' }}"
  block:

    - name: 'END | Read The Version GitLab Installed'
      changed_when: false
      check_mode: false
      register: '__gitlab_manifest__'

      ansible.builtin.command:
        argv: [ 'head', '-n', '1', '/opt/gitlab/version-manifest.txt' ]
        expand_argument_vars: false
        stdin_add_newline: true
        strip_empty_ends: true

    # all=1 adds the database, Redis and Gitaly checks to the controller's own, so on a Rails
    # node it proves that node reaches all three. Puma boots for minutes after a reconfigure.
    # 60 tries 10 seconds apart are UNMEASURED: a bound until a live run measures the boot.
    - name: 'END | Wait For GitLab To Report Ready'
      delay: 10
      register: '__gitlab_ready__'
      retries: 60
      until: ((__gitlab_ready__.json | default({})).status | default('')) == 'ok'
      when: gitlab_running.node_role in ['all-in-one', 'rails']

      ansible.builtin.uri:
        body_format: 'raw'
        decompress: true
        follow_redirects: 'safe'
        force: false
        force_basic_auth: false
        headers: {}
        http_agent: 'ansible-httpget'
        method: 'GET'
        remote_src: false
        return_content: true
        status_code: [ 200 ]
        timeout: 30
        unredirected_headers: []
        unsafe_writes: false
        url: 'http://127.0.0.1/-/readiness?all=1'
        use_gssapi: false
        use_netrc: true
        use_proxy: true
        validate_certs: true

    # The port each other role serves its peers on: gitlab-sshd on a Rails node, Gitaly and
    # Redis on theirs. UNMEASURED: a bound until a live run measures the start.
    - name: 'END | Wait For The Node Role To Listen'
      when: gitlab_running.node_role in ['rails', 'gitaly', 'redis']
      vars:
        __port__: >-
          {{ {'rails': gitlab_running.sshd.port, 'gitaly': 8075,
              'redis': gitlab_running.redis.port}[gitlab_running.node_role] }}

      ansible.builtin.wait_for:
        active_connection_states:
          - 'ESTABLISHED'
          - 'FIN_WAIT1'
          - 'FIN_WAIT2'
          - 'SYN_RECV'
          - 'SYN_SENT'
          - 'TIME_WAIT'
        connect_timeout: 5
        delay: 0
        host: '127.0.0.1'
        msg: >-
          Nothing listens on 127.0.0.1:{{ __port__ }} after 120 seconds, where the
          {{ gitlab_running.node_role }} node serves its peers.
        port: "{{ __port__ | int }}"
        sleep: 1
        state: 'started'
        timeout: 120

    # Read once GitLab reports ready, so it samples a settled node. runit reports one line per
    # service, 'run:' for a service that is up; the exit status alone is not trusted to say every
    # one is.
    - name: 'END | Read The Service Status'
      changed_when: false
      check_mode: false
      failed_when: false
      register: '__gitlab_status__'

      ansible.builtin.command:
        argv: [ 'gitlab-ctl', 'status' ]
        expand_argument_vars: false
        stdin_add_newline: true
        strip_empty_ends: true

    - name: 'END | Read Whether GitLab Runs Its Crypto In FIPS Mode'
      changed_when: false
      check_mode: false
      register: '__gitlab_fips__'

      ansible.builtin.command:
        argv: [ '/opt/gitlab/embedded/bin/ruby', '-ropenssl', '-e', 'print OpenSSL.fips_mode' ]
        expand_argument_vars: false
        stdin_add_newline: true
        strip_empty_ends: true

    - name: 'END | Read What The Reconfigure Recorded'
      register: '__gitlab_record__'

      ansible.builtin.slurp:
        armor: true
        src: '/var/opt/gitlab/.nwarila-reconfigured'

    - name: 'END | Require The Pinned Version, Running And Reconfigured As Declared'
      ansible.builtin.assert:
        fail_msg: >-
          GitLab is not the declared install. The version manifest begins
          '{{ __gitlab_manifest__.stdout }}' (declared '{{ __release__ }}'); gitlab-ctl status
          exited {{ __gitlab_status__.rc }} with services not running:
          {{ __gitlab_status__.stdout_lines | reject('match', '^run:') | list }}; OpenSSL
          fips_mode printed '{{ __gitlab_fips__.stdout }}'; the record holds
          '{{ __gitlab_record__.content | b64decode }}' (declared '{{ __record__ }}').
        quiet: true
        that:
          - __gitlab_manifest__.stdout is match(__release__ | regex_escape ~ '([^0-9.]|$)')
          - __gitlab_status__.rc == 0
          - __gitlab_status__.stdout_lines | length > 0
          - __gitlab_status__.stdout_lines | reject('match', '^run:') | list | length == 0
          - __gitlab_fips__.stdout == 'true'
          - (__gitlab_record__.content | b64decode) == __record__

    # Read afresh, after any load above: the gitlab rule must be compiled into the loaded rules
    # file. Whether it is in force, the push proof shows.
    - name: 'END | Read The Rules fapolicyd Has Compiled'
      changed_when: false
      check_mode: false
      register: '__gitlab_rules_loaded__'
      when:
        - __fapolicyd_active__ | bool
        - __runs_gitaly__ | bool

      ansible.builtin.command:
        argv: [ 'fapolicyd-cli', '--list' ]
        expand_argument_vars: false
        stdin_add_newline: true
        strip_empty_ends: true

    - name: 'END | Require The Gitaly Rule In The Compiled Rules'
      when:
        - __fapolicyd_active__ | bool
        - __runs_gitaly__ | bool

      ansible.builtin.assert:
        fail_msg: >-
          fapolicyd's compiled rules do not hold '{{ gitlab_running.fapolicyd_rule }}':
          {{ __gitlab_rules_loaded__.stdout_lines }}
        quiet: true
        that: gitlab_running.fapolicyd_rule in __gitlab_rules_loaded__.stdout

    # The fingerprints of the key files gitlab-sshd loads and of their shared source, which the
    # playbook proved equal on every Rails node.
    - name: 'END | Read The Fingerprints Of The gitlab-sshd Host Key Files'
      changed_when: false
      check_mode: false
      loop: >-
        {{ ['ecdsa', 'rsa']
           | product(['/var/opt/gitlab/gitlab-sshd', gitlab_running.sshd.host_key_source_dir])
           | list }}
      loop_control: { label: "{{ item[1] }}/ssh_host_{{ item[0] }}_key.pub" }
      register: '__gitlab_sshd_fingerprints__'
      when: __rails__ | bool

      ansible.builtin.command:
        argv: [ 'ssh-keygen', '-l', '-f', "{{ item[1] }}/ssh_host_{{ item[0] }}_key.pub" ]
        expand_argument_vars: false
        stdin_add_newline: true
        strip_empty_ends: true

    # ssh-keygen -l prints '<bits> <fingerprint> <comment> (<type>)'. Only the fingerprint is
    # compared: what stands in for a missing comment differs between OpenSSH releases.
    - name: 'END | Require gitlab-sshd''s Host Key Files To Be The Shared Ones'
      vars:
        __installed__: >-
          {{ __gitlab_sshd_fingerprints__.results
             | selectattr('item.1', 'equalto', '/var/opt/gitlab/gitlab-sshd')
             | map(attribute='stdout') | map('split', ' ') | map(attribute=1) | list }}
        __source__: >-
          {{ __gitlab_sshd_fingerprints__.results
             | rejectattr('item.1', 'equalto', '/var/opt/gitlab/gitlab-sshd')
             | map(attribute='stdout') | map('split', ' ') | map(attribute=1) | list }}
        __rsa__: >-
          {{ __gitlab_sshd_fingerprints__.results
             | selectattr('item.0', 'equalto', 'rsa')
             | map(attribute='stdout') | map('split', ' ') | map('first') | map('int') | list }}
      when: __rails__ | bool

      ansible.builtin.assert:
        fail_msg: >-
          gitlab-sshd's host key files hold {{ __installed__ }}, but the shared keys in
          {{ gitlab_running.sshd.host_key_source_dir }} are {{ __source__ }}; an RSA host key
          must be at least 3072 bits (read {{ __rsa__ }}).
        quiet: true
        that:
          - __installed__ == __source__
          - __rsa__ | reject('ge', 3072) | list | length == 0

#endregion --- [ End: Prove GitLab Runs As Declared ] ----------------------------------------- #
